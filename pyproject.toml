[project]
name = "muckrake"
version = "0.3.0"
description = "A data-pipeline framework for crawling, deduplicating and publishing FollowTheMoney entities."
readme = "README.md"
authors = [
    { name = "Nicu Calcea", email = "mail@nicu.md" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "click>=8.3.1",
    "datapatch>=1.2.4",
    "followthemoney>=4.4.0",
    "org-id>=0.1.1",
    "lxml>=6.0.2",
    "nomenklatura>=4.4.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pydantic-ai-slim[anthropic,google,openrouter]>=1.0.0,<2",
    "psycopg[binary]>=3.2.12",
    "plyvel>=1.5.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "xlrd>=2.0.2",
    "logfire[httpx,sqlalchemy]>=4.24.0",
    "odfpy>=1.4.1",
]

[project.scripts]
muckrake = "muckrake.cli:cli"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15",
    "mypy>=1.19",
    "pre-commit>=4.0",
    "types-requests>=2.32",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# LLM prompt prose; wrapping would change the prompt text.
"src/muckrake/extract/ner/engines/llm_prompt.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "banal.*",
    "datapatch.*",
    "plyvel.*",
    "org_id.*",
    "xlrd.*",
    "odf.*",
    "lxml.*",
    "bs4.*",
]
ignore_missing_imports = true
