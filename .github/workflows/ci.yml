name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  checks:
    runs-on: ubuntu-latest

    # The Postgres-only paths (e.g. the COPY-and-swap publish) are tested
    # against this; the rest of the suite runs on SQLite.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: muckrake
          POSTGRES_PASSWORD: muckrake
          POSTGRES_DB: muckrake_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U muckrake"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # plyvel (LevelDB) and pyicu (ICU) are sdist-only and compile from source.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libleveldb-dev libicu-dev pkg-config

      # --locked fails if uv.lock has drifted from pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest
        env:
          MUCKRAKE_TEST_POSTGRES_URL: postgresql://muckrake:muckrake@localhost:5432/muckrake_test

      # 🔒 muckrake stays project-agnostic: no consumer project names in src,
      # tests or dependencies (see the script for the whitelist).
      - name: Project-agnostic litmus
        run: bash scripts/litmus.sh

  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Checks every link in the Markdown docs, including relative file links and
      # #anchors.
      # Excluded: the private openlobbying/docs repo and project board, which
      # 404 without access (CLAUDE.md links them for maintainers), and loopback
      # URLs from local-setup examples.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --include-fragments
            --exclude-loopback
            --exclude '^https://github\.com/openlobbying/docs'
            --exclude '^https://github\.com/orgs/openlobbying/projects'
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
